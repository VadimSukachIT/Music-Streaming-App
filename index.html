<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Player</title>
    <link rel="stylesheet" href="Styles/styles.css">

</head>
<body>
<div id="main-page">
    <div id="header-content-section">
        <div id="header-section">
            <div id="account-button">
                <span id="account-name" class="header-text">Дмитрий Кардис</span>
            </div>
            <div id="library-buttons">
                <span id="library" class="header-text">Медиатека</span>
                <span id="recommendations" class="header-text">Рекоммендации</span>
            </div>
            <div id="search-button">
                <button type="button" name="search" class="header-text">Поиск</button>
            </div>
        </div>
        <div id="content-section">
            <div id="content-header">
                <div id="content-menu">
                    <span id="playlists">Playlists</span>
                    <span id="Songs">Songs</span>
                    <span id="Albums">Albums</span>
                    <span id="Artists">Artists</span>
                </div>
            </div>
            <div id="main-content">
                <div class="playlist">
                    <div class="playlist-cover"></div>
                    <span class="name playlist-name">A Thousand Suns</span>
                    <span class="name playlist-owner">Linkin Park</span>
                </div>
                <div class="playlist">
                    <div class="playlist-cover"></div>
                    <span class="name playlist-name">A Thousand Suns</span>
                    <span class="name playlist-owner">Linkin Park</span>
                </div>
                <div class="playlist">
                    <div class="playlist-cover"></div>
                    <span class="name playlist-name">A Thousand Suns</span>
                    <span class="name playlist-owner">Linkin Park</span>
                </div>
                <div class="playlist">
                    <div class="playlist-cover"></div>
                    <span class="name playlist-name">A Thousand Suns</span>
                    <span class="name playlist-owner">Linkin Park</span>
                </div>
                <div class="playlist">
                    <div class="playlist-cover"></div>
                    <span class="name playlist-name">A Thousand Suns</span>
                    <span class="name playlist-owner">Linkin Park</span>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div id="player-section">
            <div id="player-buttons">
                <button type="button" id="shuffle-song-button"></button>
                <button type="button" id="previous-song-button"></button>
                <button type="button" id="play-song-button"></button>
                <button type="button" id="next-song-button"></button>
                <button type="button" id="repeat-song-button"></button>
            </div>
            <div id="progress-section">
                <span id="current-song-time">0:00</span>
                <div id="song-progress-bar"></div>
                <span id="song-duration">0:00</span>
            </div>
        </div>
    </footer>
</div>
</body>
</html>
