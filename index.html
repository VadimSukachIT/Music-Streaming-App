<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Player</title>
    <link rel="stylesheet" href="Styles/content.css">
    <script defer src="classes/library.js"></script>

    <script defer src="classes/recommendations.js"></script>
    <script defer src="scripts/router.js"></script>
    <script defer src="scripts/header.js"></script>


</head>
<body>
<div id="main-page">
    <div id="search-section">
        <div class="search">
            <div class="search-content">
                <label for="search-bar">Ищите исполнителей, песни, альбомы и плейлисты</label>
                <input type="search" id="search-bar" placeholder="Начните печатать...">
            </div>
            <button type="button" id="closeSearchButton">Закрыть</button>
        </div>
        <div class="search-layout"></div>
    </div>
    <div id="header-section">
        <div class="header-container">
            <div id="library-buttons">
                <a href="#library/playlists" class="header-text">Медиатека</a>
                <a href="#recommendations/for-you" id="recommendations" class="header-text">Рекоммендации</a>
            </div>
        </div>
        <div class="right">
            <div id="search-button">
                <button type="button" name="search" class="header-text">Поиск</button>
            </div>
            <div id="account-button">
                <span id="account-name" class="header-text">Дмитрий Кардис</span>
            </div>
        </div>
    </div>
    <div id="content-section">
        <div id="content-header">
            <ul class="tags">
                <li class="playlists tag"><a href="#/library/playlists">Плейлисты</a></li>
                <li class="albums tag"><a href="#/library/albums">Альбомы</a></li>
                <li class="songs tag"><a href="#/library/songs">Песни</a></li>
                <li class="artists tag"><a href="#/library/artists">Исполнители</a></li>
            </ul>
        </div>
        <div id="main-content"></div>
    </div>
    <footer>
        <div id="player-section">
            <div id="player-buttons">
                <button type="button" id="shuffle-song-button" class="icon"></button>
                <button type="button" id="play-previous-song-button" class="icon"></button>
                <button type="button" id="play-song-button" class="icon"></button>
                <button type="button" id="play-next-song-button" class="icon"></button>
                <button type="button" id="repeat-song-button" class="icon"></button>
            </div>
            <div id="progress-section">
                <div id="current-song-time" class="time">0:00</div>
                <input type="range" id="song-progress-bar">
                <div id="song-duration" class="time">0:00</div>
            </div>
        </div>
    </footer>
</div>

</body>
</html>
